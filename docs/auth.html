<!DOCTYPE html>
<html lang="en">
<head>
  <title>UniScope | Login / Register</title>
  <link rel="stylesheet" href="css/ui.css">
</head>

<body class="auth-body">

<div class="auth-container">
  <h1>Uni<span>Scope</span></h1>
  <p class="subtitle">Discover your perfect university</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button class="secondary" onclick="register()">Create Account</button>
  <button class="admin-btn" onclick="adminLogin()">Admin Login</button>
  <p id="msg"></p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
